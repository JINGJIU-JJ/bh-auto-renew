name: bot-hosting auto renew

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bot-hosting-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # ⬅️⬆️延长超时时间应对慢页面
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          seleniumbase install chromedriver
      
      - name: Check system time (debug)
        run: |
          echo "GitHub Actions 服务器时间:" $(date '+%Y-%m-%d %H:%M:%S')
      
      - name: Run renew
        env:
          SESSION_TOKEN: ${{ secrets.SESSION
